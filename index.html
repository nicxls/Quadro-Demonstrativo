<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transporte Escolar — Cálculo Mensal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --ink: #16232c;
    --ink-soft: #56646f;
    --ink-faint: #8b96a0;
    --bg-app: #f3f5f6;
    --surface: #ffffff;
    --surface-tint: #f6f8f8;
    --border: #dee4e7;
    --border-soft: #eaeff1;
    --amber: #dd9a2e;
    --amber-tint: #fbf1de;
    --danger: #b3413b;
    --danger-tint: #fbeceb;
    --success: #2f7d4f;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow-card: 0 1px 2px rgba(22,35,44,0.04), 0 1px 1px rgba(22,35,44,0.03);
    --shadow-hover: 0 4px 14px rgba(22,35,44,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; }
  body {
    background:
      radial-gradient(circle, rgba(22,35,44,0.05) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg-app);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }

  .te-wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }

  /* Header */
  .te-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 28px; flex-wrap:wrap; gap:16px; }
  .te-header-left { display:flex; align-items:center; gap:12px; }
  .te-logo { width:38px; height:38px; border-radius:10px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .te-title { font-size: 21px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; line-height:1.2; }
  .te-sub { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .te-header-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  /* Buttons */
  .te-btn { border:none; border-radius:9px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-family:inherit; transition: background .15s ease, border-color .15s ease, transform .1s ease, box-shadow .15s ease; white-space:nowrap; }
  .te-btn svg { flex-shrink:0; }
  .te-btn:active { transform: translateY(1px); }
  .te-btn.primary { background: var(--ink); color:#fff; box-shadow: var(--shadow-card); }
  .te-btn.primary:hover { background:#0e1920; box-shadow: var(--shadow-hover); }
  .te-btn.secondary { background: var(--surface); color: var(--ink); border:1px solid var(--border); }
  .te-btn.secondary:hover { background: var(--surface-tint); border-color:#c8d1d6; }
  .te-btn.ghost { background:transparent; color:var(--danger); border:1px solid transparent; padding:6px 10px; font-size:12.5px; font-weight:500; }
  .te-btn.ghost:hover { background: var(--danger-tint); }
  .te-add-btn { font-size:13px; font-weight:600; color:var(--ink); background:var(--surface); border:1.5px dashed #b9c4cb; border-radius:9px; padding:9px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-family:inherit; transition: border-color .15s ease, background .15s ease, color .15s ease; }
  .te-add-btn:hover { background:var(--amber-tint); border-color:var(--amber); color:#8a5f14; }
  .te-remove { background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:18px; line-height:1; padding:5px 8px; border-radius:7px; transition: background .15s ease, color .15s ease; }
  .te-remove:hover { background:var(--danger-tint); color:var(--danger); }

  /* Cards */
  .te-panel { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg); padding:18px 20px; box-shadow: var(--shadow-card); }
  .te-settings { display:flex; align-items:flex-end; gap:20px; margin-bottom:26px; flex-wrap:wrap; }
  .te-settings-field { flex: 0 0 200px; }
  .te-settings-hint { font-size:12.5px; color:var(--ink-soft); padding-bottom:2px; }

  .te-type-selector { display:inline-flex; background: var(--surface); border:1px solid var(--border); border-radius: 999px; padding:4px; margin-bottom:20px; box-shadow: var(--shadow-card); }
  .te-type-btn { border:none; background:transparent; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink-soft); padding:9px 20px; border-radius:999px; cursor:pointer; transition: background .15s ease, color .15s ease; }
  .te-type-btn:hover { color:var(--ink); }
  .te-type-btn.active { background:var(--ink); color:#fff; }

  .te-summary-item-excedente { border-color: var(--amber); background: var(--amber-tint); }
  .te-summary-item-excedente .te-summary-value { color:#8a5f14; }

  .te-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:6px; display:block; }
  .te-input { width:100%; box-sizing:border-box; border:1.5px solid var(--border); border-radius: var(--radius-sm); padding:9px 11px; font-size:14px; font-family:inherit; color:var(--ink); background:var(--surface); transition: border-color .15s ease, box-shadow .15s ease; }
  .te-input:focus { outline:none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(22,35,44,0.08); }
  .te-input::placeholder { color: var(--ink-faint); }

  .te-section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin: 20px 0 10px; display:flex; align-items:center; gap:6px; }

  /* Route / stops */
  .te-route { display:flex; flex-direction:column; }
  .te-stop { display:flex; gap:16px; }
  .te-stop-rail { display:flex; flex-direction:column; align-items:center; width:34px; flex-shrink:0; padding-top:2px; }
  .te-stop-badge { width:30px; height:30px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:"IBM Plex Mono", monospace; box-shadow: 0 0 0 5px var(--bg-app); z-index:1; flex-shrink:0; }
  .te-stop-line { flex:1; width:0; border-left: 2.5px dashed var(--amber); margin: 6px 0 6px; min-height: 20px; }
  .te-stop-card { flex:1; min-width:0; margin-bottom:16px; }

  .te-geo-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .te-geo-title { font-size:14px; font-weight:700; color:var(--ink); }
  .te-geo-title span { color: var(--ink-soft); font-weight:500; }

  .te-grid2 { display:grid; grid-template-columns: 1.2fr 1fr; gap:14px; margin-bottom:6px; }

  .te-escola-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .te-escola-dot { width:6px; height:6px; border-radius:50%; background:var(--amber); flex-shrink:0; }

  .te-diagroup { background: var(--surface-tint); border:1px solid var(--border-soft); border-radius: var(--radius-md); padding:14px 16px; margin-bottom:10px; }
  .te-periodo-label { font-size:11.5px; font-weight:700; color:var(--ink); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.04em; }
  .te-diagroup-row { display:flex; align-items:flex-end; gap:10px; justify-content:space-between; flex-wrap:wrap; margin-top:12px; }
  .te-selected-count { font-size:13px; color:var(--ink-soft); }
  .te-selected-count strong { color:var(--ink); font-family:"IBM Plex Mono", monospace; }
  .te-preview { font-size:12px; color:var(--ink-soft); margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .te-preview strong { color: var(--ink); }

  /* Calendar */
  .te-calendar { max-width: 320px; }
  .te-calendar-header { display:grid; grid-template-columns: repeat(7, 1fr); gap:3px; margin-bottom:5px; }
  .te-cal-headcell { text-align:center; font-size:9.5px; font-weight:700; color:var(--ink); text-transform:uppercase; letter-spacing:0.03em; padding:5px 1px; cursor:pointer; border-radius:6px; background:var(--surface); border:1px solid var(--border-soft); transition: background .15s ease, border-color .15s ease; }
  .te-cal-headcell:hover { background:var(--amber-tint); border-color:var(--amber); }
  .te-cal-headcell.disabled { cursor:default; color:var(--ink-faint); background:transparent; border-color:transparent; }
  .te-calendar-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:3px; max-width: 320px; }
  .te-cal-cell { aspect-ratio: 1 / 1; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:"IBM Plex Mono", monospace; border-radius:6px; border:1px solid var(--border-soft); background:var(--surface); cursor:pointer; color:var(--ink-soft); transition: background .12s ease, border-color .12s ease, color .12s ease, transform .08s ease; }
  .te-cal-cell:hover { border-color: var(--ink); color:var(--ink); }
  .te-cal-cell.selected { background: var(--ink); border-color:var(--ink); color:#fff; font-weight:700; }
  .te-cal-cell.selected:hover { background:#0e1920; }
  .te-cal-cell.disabled { background:transparent; color:#d3d9dc; cursor:default; border-color:transparent; }
  .te-cal-cell.disabled:hover { border-color:transparent; }
  .te-cal-cell.empty { visibility:hidden; }

  /* Table */
  .te-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  table.te-table { width:100%; border-collapse:collapse; font-size:13.5px; background: var(--surface); }
  table.te-table th { background: var(--surface-tint); color:var(--ink); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; padding:12px 10px; border-bottom:1.5px solid var(--border); border-right:1px solid var(--border-soft); text-align:center; white-space:nowrap; }
  table.te-table th:last-child { border-right:none; }
  table.te-table td { padding:11px 10px; border-bottom:1px solid var(--border-soft); border-right:1px solid var(--border-soft); text-align:center; vertical-align:middle; color:var(--ink); }
  table.te-table td:last-child { border-right:none; }
  table.te-table tbody tr:last-child td { border-bottom:none; }
  table.te-table td.te-escolas-cell { text-align:left; font-weight:500; }
  table.te-table td.te-num { font-family:"IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  table.te-table tbody tr:hover td { background: var(--surface-tint); }
  table.te-table tr.te-total-row td { font-weight:700; background: var(--amber-tint); border-bottom:none; }
  table.te-table tr.te-total-row:hover td { background: var(--amber-tint); }

  .te-empty-state { text-align:center; padding:44px 20px; color:var(--ink-soft); }
  .te-empty-state svg { margin-bottom:10px; opacity:0.5; }
  .te-empty-state .te-empty-title { font-size:14px; font-weight:600; color:var(--ink); margin-bottom:4px; }
  .te-empty-state .te-empty-sub { font-size:13px; }

  .te-summary-row { display:flex; gap:14px; margin-top:16px; flex-wrap:wrap; }
  .te-summary-item { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); padding:14px 18px; box-shadow: var(--shadow-card); flex:1; min-width:160px; }
  .te-summary-label { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; }
  .te-summary-value { font-size:19px; font-weight:700; color:var(--ink); margin-top:4px; font-family:"IBM Plex Mono", monospace; }

  .te-copy-status { font-size:12.5px; color:var(--success); font-weight:600; display:inline-flex; align-items:center; gap:5px; }

  .te-print-only { display:none; }
  @media print {
    .te-no-print { display:none !important; }
    .te-print-only { display:block !important; }
    body { background:#fff; }
    .te-wrap { margin:0; padding:0; max-width:none; }
    table.te-print-table { width:100%; border-collapse:collapse; font-size:12px; font-family: Arial, sans-serif; }
    table.te-print-table th { background:#fff; font-weight:700; border:1px solid #000; padding:6px 6px; text-align:center; }
    table.te-print-table td { border:1px solid #000; padding:6px 6px; text-align:center; }
    table.te-print-table td.te-escolas-cell { text-align:left; }
    table.te-print-table tr.te-total-row td { font-weight:700; }
  }

  @media (max-width: 640px) {
    .te-grid2 { grid-template-columns: 1fr; }
    .te-settings { flex-direction:column; align-items:stretch; }
    .te-settings-field { flex-basis:auto; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const DIAS_SEMANA = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function formatBRL(value) {
  if (!isFinite(value)) return "R$ 0,00";
  return value.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatNum(value, decimals = 2) {
  if (!isFinite(value)) return (0).toFixed(decimals).replace(".", ",");
  return value.toLocaleString("pt-BR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function parseNum(str) {
  if (typeof str === "number") return str;
  if (!str) return 0;
  const cleaned = String(str).replace(/\./g, "").replace(",", ".");
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function pad2(n) { return String(n).padStart(2, "0"); }

function defaultMonth() {
  const now = new Date();
  return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
}

// Monday=0 ... Saturday=5, Sunday=6
function weekdayColumn(jsDay) { return jsDay === 0 ? 6 : jsDay - 1; }

function getMonthMeta(mesRef) {
  const [y, m] = mesRef.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${pad2(m)}-${pad2(d)}`;
    const jsDay = new Date(y, m - 1, d).getDay();
    cells.push({ date: dateStr, day: d, jsDay, col: weekdayColumn(jsDay) });
  }
  const leading = Array(cells.length ? cells[0].col : 0).fill(null);
  return { cells, leading };
}

function datesForWeekdayInMonth(mesRef, weekdayName) {
  const idx = DIAS_SEMANA.indexOf(weekdayName);
  const meta = getMonthMeta(mesRef);
  return meta.cells.filter(c => c.col === idx).map(c => c.date);
}

function monthLabel(mesRef) {
  if (!mesRef) return "";
  const [y, m] = mesRef.split("-").map(Number);
  const d = new Date(y, m - 1, 1);
  const label = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

let idCounter = 1;
function nextId() { return idCounter++; }
function makePeriodo() {
  return { id: nextId(), selectedDates: [], valorKm: "" };
}
function makeGeo() {
  return {
    id: nextId(),
    numero: "",
    kmDia: "",
    escolas: [{ id: nextId(), nome: "" }],
    periodos: [makePeriodo()],
  };
}

// Icons
const IconBus = () => (
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M4 17h1a2 2 0 1 0 4 0h6a2 2 0 1 0 4 0h1" />
    <path d="M4 17V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10" />
    <path d="M4 11h16" />
    <path d="M7 5v6M13 5v6" />
  </svg>
);
const IconCopy = () => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
  </svg>
);
const IconPdf = () => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" />
  </svg>
);
const IconPlus = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 5v14M5 12h14" />
  </svg>
);
const IconMap = () => (
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
    <path d="m9 20-5.5 2.5V6.5L9 4l6 2.5 5.5-2.5v16L15 22.5 9 20Z" />
    <path d="M9 4v16M15 6.5v16" />
  </svg>
);

function TransporteEscolar() {
  const [tipo, setTipo] = useState("contrato");
  const [valorKm, setValorKm] = useState("");
  const [valorDiarioContrato, setValorDiarioContrato] = useState("");
  const [mesReferencia, setMesReferencia] = useState(defaultMonth());
  const [geos, setGeos] = useState([makeGeo()]);

  const valorKmNum = parseNum(valorKm);
  const monthMeta = useMemo(() => getMonthMeta(mesReferencia), [mesReferencia]);

  const rows = useMemo(() => {
    const out = [];
    geos.forEach((g) => {
      const kmDia = parseNum(g.kmDia);
      const escolasTxt = g.escolas.filter(e => e.nome.trim()).map(e => e.nome).join(" / ") || "—";
      g.periodos.forEach((p) => {
        const datesInMonth = p.selectedDates.filter(d => d.startsWith(mesReferencia));
        const dias = datesInMonth.length;
        const precoKm = p.valorKm.trim() !== "" ? parseNum(p.valorKm) : valorKmNum;
        const valorDiario = kmDia * precoKm;
        const valorCobrado = valorDiario * dias;
        const kmMes = kmDia * dias;
        const usedWeekdays = new Set();
        datesInMonth.forEach(d => {
          const dt = new Date(d + "T00:00:00");
          const col = weekdayColumn(dt.getDay());
          if (col < 6) usedWeekdays.add(DIAS_SEMANA[col]);
        });
        const diaLabel = DIAS_SEMANA.filter(dd => usedWeekdays.has(dd)).join("/") || "—";
        out.push({ rowId: `${g.id}-${p.id}`, numero: g.numero, escolasTxt, dia: diaLabel, kmDia, precoKm, dias, valorDiario, valorCobrado, kmMes });
      });
    });
    return out;
  }, [geos, valorKmNum, mesReferencia]);

  const totalDias = rows.reduce((s, r) => s + r.dias, 0);
  const totalValorCobrado = rows.reduce((s, r) => s + r.valorCobrado, 0);
  const totalKmMes = rows.reduce((s, r) => s + r.kmMes, 0);
  const mediaDia = totalDias > 0 ? totalKmMes / totalDias : 0;

  const valorDiarioContratoNum = parseNum(valorDiarioContrato);
  const valorContratoTotal = valorDiarioContratoNum * totalDias;
  const valorExcedente = Math.max(0, totalValorCobrado - valorContratoTotal);

  function updateGeo(id, field, value) {
    setGeos(prev => prev.map(g => g.id === id ? { ...g, [field]: value } : g));
  }
  function addGeo() { setGeos(prev => [...prev, makeGeo()]); }
  function removeGeo(id) { setGeos(prev => prev.length > 1 ? prev.filter(g => g.id !== id) : prev); }
  function addEscola(geoId) {
    setGeos(prev => prev.map(g => g.id === geoId ? { ...g, escolas: [...g.escolas, { id: nextId(), nome: "" }] } : g));
  }
  function removeEscola(geoId, escolaId) {
    setGeos(prev => prev.map(g => g.id === geoId ? { ...g, escolas: g.escolas.length > 1 ? g.escolas.filter(e => e.id !== escolaId) : g.escolas } : g));
  }
  function updateEscola(geoId, escolaId, nome) {
    setGeos(prev => prev.map(g => g.id === geoId ? { ...g, escolas: g.escolas.map(e => e.id === escolaId ? { ...e, nome } : e) } : g));
  }
  function addPeriodo(geoId) {
    setGeos(prev => prev.map(g => g.id === geoId ? { ...g, periodos: [...g.periodos, makePeriodo()] } : g));
  }
  function removePeriodo(geoId, periodoId) {
    setGeos(prev => prev.map(g => g.id === geoId ? { ...g, periodos: g.periodos.length > 1 ? g.periodos.filter(p => p.id !== periodoId) : g.periodos } : g));
  }
  function updatePeriodo(geoId, periodoId, field, value) {
    setGeos(prev => prev.map(g => g.id === geoId ? { ...g, periodos: g.periodos.map(p => p.id === periodoId ? { ...p, [field]: value } : p) } : g));
  }
  function toggleDate(geoId, periodoId, dateStr) {
    setGeos(prev => prev.map(g => {
      if (g.id !== geoId) return g;
      return {
        ...g,
        periodos: g.periodos.map(p => {
          if (p.id !== periodoId) return p;
          const has = p.selectedDates.includes(dateStr);
          const novo = has ? p.selectedDates.filter(d => d !== dateStr) : [...p.selectedDates, dateStr];
          return { ...p, selectedDates: novo };
        }),
      };
    }));
  }
  function toggleWeekdayColumn(geoId, periodoId, weekdayName) {
    const datesCol = datesForWeekdayInMonth(mesReferencia, weekdayName);
    setGeos(prev => prev.map(g => {
      if (g.id !== geoId) return g;
      return {
        ...g,
        periodos: g.periodos.map(p => {
          if (p.id !== periodoId) return p;
          const allSelected = datesCol.every(d => p.selectedDates.includes(d));
          let novo;
          if (allSelected) {
            novo = p.selectedDates.filter(d => !datesCol.includes(d));
          } else {
            novo = Array.from(new Set([...p.selectedDates, ...datesCol]));
          }
          return { ...p, selectedDates: novo };
        }),
      };
    }));
  }
  function handlePrint() { window.print(); }

  const [copyStatus, setCopyStatus] = useState("");

  function copyTable() {
    const headers = ["Escolas","Geo","Dias","Km/Dia","Preço/km","Valor Diário","Nº de Dias","Valor cobrado","Média/Dia"];

    const tsvLines = [headers.join("\t")];
    rows.forEach((r) => {
      tsvLines.push([
        r.escolasTxt,
        r.numero || "—",
        r.dia,
        formatNum(r.kmDia),
        formatBRL(r.precoKm),
        formatBRL(r.valorDiario),
        formatNum(r.dias, 0),
        formatBRL(r.valorCobrado),
        formatNum(mediaDia, 5),
      ].join("\t"));
    });
    tsvLines.push(["", "", "", "", "", "", formatNum(totalDias, 0), formatBRL(totalValorCobrado), ""].join("\t"));
    if (tipo === "contrato" && valorDiarioContratoNum > 0) {
      tsvLines.push("");
      tsvLines.push(`Valor do contrato\t${formatBRL(valorContratoTotal)}`);
      tsvLines.push(`Valor excedente\t${formatBRL(valorExcedente)}`);
    }
    const tsv = tsvLines.join("\n");

    let htmlRows = "";
    rows.forEach((r, i) => {
      htmlRows += "<tr>" +
        `<td style="text-align:left;border:1px solid #000;padding:6px;">${r.escolasTxt}</td>` +
        `<td style="border:1px solid #000;padding:6px;text-align:center;">${r.numero || "—"}</td>` +
        `<td style="border:1px solid #000;padding:6px;text-align:center;">${r.dia}</td>` +
        `<td style="border:1px solid #000;padding:6px;text-align:center;">${formatNum(r.kmDia)}</td>` +
        `<td style="border:1px solid #000;padding:6px;text-align:center;">${formatBRL(r.precoKm)}</td>` +
        `<td style="border:1px solid #000;padding:6px;text-align:center;">${formatBRL(r.valorDiario)}</td>` +
        `<td style="border:1px solid #000;padding:6px;text-align:center;">${formatNum(r.dias, 0)}</td>` +
        `<td style="border:1px solid #000;padding:6px;text-align:center;">${formatBRL(r.valorCobrado)}</td>` +
        (i === 0 ? `<td rowspan="${rows.length}" style="border:1px solid #000;padding:6px;text-align:center;vertical-align:middle;">${formatNum(mediaDia, 5)}</td>` : "") +
        "</tr>";
    });
    const htmlTotalRow = "<tr>" +
      `<td style="border:1px solid #000;padding:6px;"></td>`.repeat(6) +
      `<td style="border:1px solid #000;padding:6px;text-align:center;font-weight:bold;">${formatNum(totalDias, 0)}</td>` +
      `<td style="border:1px solid #000;padding:6px;text-align:center;font-weight:bold;">${formatBRL(totalValorCobrado)}</td>` +
      "</tr>";

    const table = `<table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:12px;">` +
      `<thead><tr>${headers.map(h => `<th style="border:1px solid #000;padding:6px;background:#eaf0f5;">${h}</th>`).join("")}</tr></thead>` +
      `<tbody>${htmlRows}${htmlTotalRow}</tbody></table>`;

    let contratoBlock = "";
    if (tipo === "contrato" && valorDiarioContratoNum > 0) {
      contratoBlock = `<table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:12px;margin-top:10px;">` +
        `<tbody>` +
        `<tr><td style="border:1px solid #000;padding:6px;">Valor do contrato</td><td style="border:1px solid #000;padding:6px;font-weight:bold;">${formatBRL(valorContratoTotal)}</td></tr>` +
        `<tr><td style="border:1px solid #000;padding:6px;">Valor excedente</td><td style="border:1px solid #000;padding:6px;font-weight:bold;">${formatBRL(valorExcedente)}</td></tr>` +
        `</tbody></table>`;
    }

    const html = table + contratoBlock;

    async function doCopy() {
      try {
        if (window.ClipboardItem) {
          const item = new ClipboardItem({
            "text/html": new Blob([html], { type: "text/html" }),
            "text/plain": new Blob([tsv], { type: "text/plain" }),
          });
          await navigator.clipboard.write([item]);
        } else {
          await navigator.clipboard.writeText(tsv);
        }
        setCopyStatus("Tabela copiada!");
      } catch (err) {
        try {
          await navigator.clipboard.writeText(tsv);
          setCopyStatus("Tabela copiada!");
        } catch (err2) {
          setCopyStatus("Não foi possível copiar automaticamente.");
        }
      }
      setTimeout(() => setCopyStatus(""), 2500);
    }
    doCopy();
  }

  return (
    <div className="te-wrap">
      <div className="te-header te-no-print">
        <div className="te-header-left">
          <div className="te-logo"><IconBus /></div>
          <div>
            <div className="te-title">Transporte escolar</div>
            <div className="te-sub">Cálculo mensal de roteiros (GEOs) e geração de relatório</div>
          </div>
        </div>
        <div className="te-header-actions">
          {copyStatus && <span className="te-copy-status">{copyStatus}</span>}
          <button className="te-btn primary" onClick={copyTable}><IconCopy />Copiar tabela</button>
        </div>
      </div>

      <div className="te-no-print">
        <div className="te-type-selector">
          <button
            className={"te-type-btn" + (tipo === "contrato" ? " active" : "")}
            onClick={() => setTipo("contrato")}
          >
            Contrato
          </button>
          <button
            className={"te-type-btn" + (tipo === "indenizatorio" ? " active" : "")}
            onClick={() => setTipo("indenizatorio")}
          >
            Indenizatório
          </button>
        </div>

        <div className="te-panel te-settings">
          <div className="te-settings-field">
            <span className="te-label">Mês</span>
            <input className="te-input" type="month" value={mesReferencia} onChange={e => setMesReferencia(e.target.value)} />
          </div>
          <div className="te-settings-field">
            <span className="te-label">Valor do km (R$)</span>
            <input className="te-input mono" value={valorKm} onChange={e => setValorKm(e.target.value)} placeholder="0,00" inputMode="decimal" />
          </div>
          {tipo === "contrato" && (
            <div className="te-settings-field">
              <span className="te-label">Valor diário do contrato (R$)</span>
              <input className="te-input mono" value={valorDiarioContrato} onChange={e => setValorDiarioContrato(e.target.value)} placeholder="0,00" inputMode="decimal" />
            </div>
          )}
          <div className="te-settings-hint">Esses valores são usados no cálculo de todos os GEOs cadastrados abaixo.</div>
        </div>
      </div>

      <>
      <div className="te-no-print">

        <div className="te-route">
          {geos.map((g, idx) => (
            <div className="te-stop" key={g.id}>
              <div className="te-stop-rail">
                <div className="te-stop-badge">{idx + 1}</div>
                {idx < geos.length - 1 && <div className="te-stop-line"></div>}
              </div>
              <div className="te-panel te-stop-card">
                <div className="te-geo-head">
                  <div className="te-geo-title">GEO {idx + 1}{g.numero ? <span> · {g.numero}</span> : null}</div>
                  {geos.length > 1 && <button className="te-btn ghost" onClick={() => removeGeo(g.id)}>Remover</button>}
                </div>

                <div className="te-grid2">
                  <div>
                    <span className="te-label">Número do GEO</span>
                    <input className="te-input" value={g.numero} onChange={e => updateGeo(g.id, "numero", e.target.value)} placeholder="Ex: 1210/2026" />
                  </div>
                  <div>
                    <span className="te-label">Km/dia</span>
                    <input className="te-input mono" value={g.kmDia} onChange={e => updateGeo(g.id, "kmDia", e.target.value)} placeholder="Ex: 468,40" inputMode="decimal" />
                  </div>
                </div>

                <div className="te-section-title">Escolas atendidas</div>
                {g.escolas.map(e => (
                  <div className="te-escola-row" key={e.id}>
                    <span className="te-escola-dot"></span>
                    <input className="te-input" value={e.nome} onChange={ev => updateEscola(g.id, e.id, ev.target.value)} placeholder="Nome da escola" />
                    {g.escolas.length > 1 && <button className="te-remove" onClick={() => removeEscola(g.id, e.id)} aria-label="Remover escola">×</button>}
                  </div>
                ))}
                <button className="te-add-btn" onClick={() => addEscola(g.id)}><IconPlus />Adicionar escola</button>

                <div className="te-section-title">Dias em que o GEO roda — {monthLabel(mesReferencia)}</div>
                {g.periodos.map((p, pIdx) => {
                  const datesInMonth = p.selectedDates.filter(d => d.startsWith(mesReferencia));
                  const previewLabel = (() => {
                    const used = new Set();
                    datesInMonth.forEach(d => {
                      const dt = new Date(d + "T00:00:00");
                      const col = weekdayColumn(dt.getDay());
                      if (col < 6) used.add(DIAS_SEMANA[col]);
                    });
                    return DIAS_SEMANA.filter(dd => used.has(dd)).join("/") || "—";
                  })();
                  return (
                    <div className="te-diagroup" key={p.id}>
                      {g.periodos.length > 1 && <div className="te-periodo-label">Período {pIdx + 1}</div>}

                      <div className="te-calendar">
                        <div className="te-calendar-header">
                          {DIAS_SEMANA.map(dd => (
                            <div key={dd} className="te-cal-headcell" onClick={() => toggleWeekdayColumn(g.id, p.id, dd)} title={`Marcar/desmarcar todas as ${dd.toLowerCase()}s do mês`}>
                              {dd.slice(0, 3)}
                            </div>
                          ))}
                          <div className="te-cal-headcell disabled">Dom</div>
                        </div>
                        <div className="te-calendar-grid">
                          {monthMeta.leading.map((_, i) => <div key={"lead" + i} className="te-cal-cell empty"></div>)}
                          {monthMeta.cells.map(cell => {
                            const isSunday = cell.jsDay === 0;
                            const selected = p.selectedDates.includes(cell.date);
                            return (
                              <div
                                key={cell.date}
                                className={"te-cal-cell" + (isSunday ? " disabled" : "") + (selected ? " selected" : "")}
                                onClick={() => !isSunday && toggleDate(g.id, p.id, cell.date)}
                              >
                                {cell.day}
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div className="te-diagroup-row">
                        <div className="te-selected-count"><strong>{datesInMonth.length}</strong> dia(s) selecionado(s)</div>
                        {pIdx > 0 && (
                          <div style={{ flex: 1, maxWidth: 240 }}>
                            <span className="te-label" style={{ marginBottom: 4 }}>Valor do km neste período (opcional)</span>
                            <input className="te-input mono" value={p.valorKm} onChange={ev => updatePeriodo(g.id, p.id, "valorKm", ev.target.value)} placeholder={`Padrão: ${valorKm || "0,00"}`} inputMode="decimal" />
                          </div>
                        )}
                        {g.periodos.length > 1 && <button className="te-remove" onClick={() => removePeriodo(g.id, p.id)} aria-label="Remover período">×</button>}
                      </div>
                      <div className="te-preview">Vai aparecer como: <strong>{previewLabel}</strong>{p.valorKm.trim() !== "" ? ` · km a ${formatBRL(parseNum(p.valorKm))}` : ""}</div>
                    </div>
                  );
                })}
                <button className="te-add-btn" onClick={() => addPeriodo(g.id)}><IconPlus />Adicionar período (ex: preço do km mudou no mês)</button>
              </div>
            </div>
          ))}
        </div>

        <button className="te-btn secondary" onClick={addGeo} style={{ marginLeft: 50 }}><IconPlus />Adicionar GEO</button>
      </div>

      <h3 style={{ margin: "30px 0 12px", fontSize: 15, fontWeight: 700, color: "var(--ink)" }} className="te-no-print">Tabela de valores</h3>

      <div className="te-table-wrap te-no-print">
        <table className="te-table">
          <thead>
            <tr>
              <th>Escolas</th><th>Geo</th><th>Dias</th><th>Km/Dia</th><th>Preço/km</th><th>Valor Diário</th><th>Nº de Dias</th><th>Valor cobrado</th><th>Média/Dia</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 ? (
              <tr><td colSpan={9}>
                <div className="te-empty-state">
                  <IconMap />
                  <div className="te-empty-title">Nenhum GEO cadastrado ainda</div>
                  <div className="te-empty-sub">Adicione o primeiro roteiro acima para ver a tabela de valores.</div>
                </div>
              </td></tr>
            ) : (
              <>
                {rows.map((r, i) => (
                  <tr key={r.rowId}>
                    <td className="te-escolas-cell">{r.escolasTxt}</td>
                    <td>{r.numero || "—"}</td>
                    <td>{r.dia}</td>
                    <td className="te-num">{formatNum(r.kmDia)}</td>
                    <td className="te-num">{formatBRL(r.precoKm)}</td>
                    <td className="te-num">{formatBRL(r.valorDiario)}</td>
                    <td className="te-num">{formatNum(r.dias, 0)}</td>
                    <td className="te-num">{formatBRL(r.valorCobrado)}</td>
                    {i === 0 && <td className="te-num" rowSpan={rows.length}>{formatNum(mediaDia, 5)}</td>}
                  </tr>
                ))}
                <tr className="te-total-row">
                  <td></td><td></td><td></td><td></td><td></td><td></td>
                  <td className="te-num">{formatNum(totalDias, 0)}</td>
                  <td className="te-num">{formatBRL(totalValorCobrado)}</td>
                </tr>
              </>
            )}
          </tbody>
        </table>
      </div>

      {rows.length > 0 && (
        <div className="te-summary-row te-no-print">
          <div className="te-summary-item">
            <div className="te-summary-label">Total de dias</div>
            <div className="te-summary-value">{formatNum(totalDias, 0)}</div>
          </div>
          <div className="te-summary-item">
            <div className="te-summary-label">Total do valor cobrado</div>
            <div className="te-summary-value">{formatBRL(totalValorCobrado)}</div>
          </div>
          <div className="te-summary-item">
            <div className="te-summary-label">Média/dia</div>
            <div className="te-summary-value">{formatNum(mediaDia, 5)}</div>
          </div>
          {tipo === "contrato" && valorDiarioContratoNum > 0 && (
            <>
              <div className="te-summary-item">
                <div className="te-summary-label">Valor do contrato</div>
                <div className="te-summary-value">{formatBRL(valorContratoTotal)}</div>
              </div>
              <div className="te-summary-item te-summary-item-excedente">
                <div className="te-summary-label">Valor excedente</div>
                <div className="te-summary-value">{formatBRL(valorExcedente)}</div>
              </div>
            </>
          )}
        </div>
      )}
      </>

      <div className="te-print-only">
        <table className="te-print-table">
          <thead>
            <tr>
              <th>Escolas</th><th>Geo</th><th>Dias</th><th>Km/Dia</th><th>Preço/km</th><th>Valor Diário</th><th>Nº de Dias</th><th>Valor cobrado</th><th>Média/Dia</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={r.rowId}>
                <td className="te-escolas-cell">{r.escolasTxt}</td>
                <td>{r.numero || "—"}</td>
                <td>{r.dia}</td>
                <td>{formatNum(r.kmDia)}</td>
                <td>{formatBRL(r.precoKm)}</td>
                <td>{formatBRL(r.valorDiario)}</td>
                <td>{formatNum(r.dias, 0)}</td>
                <td>{formatBRL(r.valorCobrado)}</td>
                {i === 0 && <td rowSpan={rows.length}>{formatNum(mediaDia, 5)}</td>}
              </tr>
            ))}
            <tr className="te-total-row">
              <td></td><td></td><td></td><td></td><td></td><td></td>
              <td>{formatNum(totalDias, 0)}</td>
              <td>{formatBRL(totalValorCobrado)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TransporteEscolar />);
</script>
</body>
</html>
